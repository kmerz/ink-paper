# ink-paper theme (begin)
# Uses the terminal's own colors (default fg/bg and ANSI 1 = red, 8 = muted gray),
# so it follows light/dark together with Ghostty, Ptyxis and gnome-terminal.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB,tmux-256color:RGB"
set -g status-style "bg=default,fg=colour8"
set -g status-left "#[fg=colour1]■ #[fg=default]#S  "
set -g status-left-length 30
set -g status-right "#[fg=colour8]%H:%M "
set -g window-status-format " #I #W "
set -g window-status-current-format "#[fg=default,bold] #I #W "
set -g window-status-separator ""
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour1"
set -g message-style "bg=default,fg=colour1"
set -g mode-style "bg=colour8,fg=default"
set -g clock-mode-colour colour1
# ink-paper theme (end)
